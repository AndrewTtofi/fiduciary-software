name: Deploy to production

# Deploys the platform to the production host via the self-hosted runner over
# the private network. The runner SSHes to the box and runs deploy/deploy-oro.sh
# (git pull → pull prebuilt image → up → health gate). No public SSH involved.
#
# Triggers:
#   • after CI succeeds on main (deploys the freshly built image)
#   • manual (Actions → Deploy to production → Run workflow)
#
# Server access — configured via repo variables (falls back to the legacy box):
#   ORO_HOST       — private IP/host of the production box
#   ORO_SSH_PORT   — SSH port on the box (default 22)
#   ORO_SSH_USER   — SSH user (default ubuntu)
#   ORO_PUBLIC_URL — public base URL of the app (e.g. http://185.106.101.11:8081);
#                    written into the box .env as APP_URL/AUTH_URL
# Optional repo secret:
#   ORO_DEPLOY_KEY — private SSH key authorized on the box. When unset, the
#                    runner's own default SSH identity is used instead.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-oro
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production (self-hosted runner)
    runs-on: [self-hosted, oro-ci]
    # The job token is forwarded to the box for the private-repo git fetch and
    # the GHCR image pull — no long-lived credentials live on the box.
    permissions:
      contents: read
      packages: read
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy over the private network
        env:
          ORO_DEPLOY_KEY: ${{ secrets.ORO_DEPLOY_KEY }}
          GH_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORO_HOST: ${{ vars.ORO_HOST || '10.50.40.100' }}
          ORO_SSH_PORT: ${{ vars.ORO_SSH_PORT || '22' }}
          ORO_SSH_USER: ${{ vars.ORO_SSH_USER || 'ubuntu' }}
          ORO_PUBLIC_URL: ${{ vars.ORO_PUBLIC_URL }}
          # Managed config injected into the box .env by deploy-oro.sh.
          SUPER_ADMIN_EMAILS: ${{ secrets.SUPER_ADMIN_EMAILS }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          # White-label firm identity → applied to the app's branding (single
          # source of truth; COMPANY_NAME is also used by the deploy notifier).
          # Empty → neutral wording / existing branding preserved.
          COMPANY_NAME: ${{ vars.COMPANY_NAME }}
          COMPANY_LEGAL_NAME: ${{ vars.COMPANY_LEGAL_NAME }}
          COMPANY_EMAIL: ${{ vars.COMPANY_EMAIL }}
          COMPANY_ADDRESS: ${{ vars.COMPANY_ADDRESS }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=accept-new -p "$ORO_SSH_PORT")
          # Prefer the ORO_DEPLOY_KEY secret; fall back to the runner's own SSH
          # identity when the key already lives on the runner machine.
          if [ -n "$ORO_DEPLOY_KEY" ]; then
            install -m 700 -d "$HOME/.ssh"
            printf '%s\n' "$ORO_DEPLOY_KEY" > "$HOME/.ssh/oro_deploy"
            chmod 600 "$HOME/.ssh/oro_deploy"
            trap 'rm -f "$HOME/.ssh/oro_deploy"' EXIT
            SSH_OPTS+=(-i "$HOME/.ssh/oro_deploy")
          fi

          # Pass secret-backed config to the remote shell; deploy-oro.sh reads
          # them from env and writes them into /opt/oro/.env. GitHub masks values.
          ssh "${SSH_OPTS[@]}" "$ORO_SSH_USER@$ORO_HOST" \
              "SUPER_ADMIN_EMAILS='${SUPER_ADMIN_EMAILS}' SUPER_ADMIN_PASSWORD='${SUPER_ADMIN_PASSWORD}' COMPANY_NAME='${COMPANY_NAME}' COMPANY_LEGAL_NAME='${COMPANY_LEGAL_NAME}' COMPANY_EMAIL='${COMPANY_EMAIL}' COMPANY_ADDRESS='${COMPANY_ADDRESS}' ORO_PUBLIC_URL='${ORO_PUBLIC_URL}' GH_ACCESS_TOKEN='${GH_ACCESS_TOKEN}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/oro
          # Private repo + private GHCR package: authenticate both with the
          # short-lived job token (never persisted to the origin remote).
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_ACCESS_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth_header" fetch --depth=1 origin main
          git reset --hard origin/main
          printf '%s' "$GH_ACCESS_TOKEN" | docker login ghcr.io -u x-access-token --password-stdin
          deploy_rc=0
          bash deploy/deploy-oro.sh || deploy_rc=$?
          docker logout ghcr.io || true
          exit "$deploy_rc"
          REMOTE
